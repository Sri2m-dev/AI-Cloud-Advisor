events {}

http {
    upstream streamlit_frontend {
        server frontend:8501;
    }

    upstream fastapi_backend {
        server api:8000;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        # Public API remains unavailable until its separate acceptance gate.
        # Backend callers on the container network retain api:8000 access.
        location /api/ { return 404; }
        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }

        location /health {
            proxy_pass http://fastapi_backend/health;
        }

        # Prometheus scrapes api:8000 privately, never this public listener.
        location /metrics { return 404; }

        location / {
            proxy_pass http://streamlit_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
