name: nexora-g08-canonical-gateway-qual-20261111-1818

services:
  database:
    image: docker.io/library/postgres@sha256:73bedc9eaa0121b92b9b26bb52e5141b3f6f37479c7ef913c0160455763ca80a
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_DB: nexora_m2c_g08gateway_20261111
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - database_password
    volumes:
      - g08_gateway_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora_m2c_g08gateway_20261111"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  qualification:
    image: docker.io/library/postgres@sha256:73bedc9eaa0121b92b9b26bb52e5141b3f6f37479c7ef913c0160455763ca80a
    pull_policy: never
    profiles: ["qualification"]
    network_mode: service:database
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - >-
        cp /run/secrets/pgpass /tmp/pgpass &&
        chmod 600 /tmp/pgpass &&
        export PGPASSFILE=/tmp/pgpass &&
        exec psql -X -v ON_ERROR_STOP=1
        -f /qualification/database/contracts/g08_m2c/qualification/install_and_test.sql
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: nexora_m2c_g08gateway_20261111
      PGUSER: postgres
      PGPASSFILE: /run/secrets/pgpass
      PGOPTIONS: -c nexora.qualification_authorized=local-disposable
    secrets:
      - pgpass
    volumes:
      - type: bind
        source: ../..
        target: /qualification
        read_only: true
        bind:
          create_host_path: false

networks:
  private:
    name: nexora-g08-canonical-gateway-qual-20261111-1818_private
    internal: true

volumes:
  g08_gateway_data:
    name: nexora-g08-canonical-gateway-qual-20261111-1818_postgres

secrets:
  database_password:
    file: ${NEXORA_G08_QUAL_PASSWORD_FILE:?Set external disposable test password file}
  pgpass:
    file: ${NEXORA_G08_QUAL_PGPASS_FILE:?Set external disposable pgpass file}
