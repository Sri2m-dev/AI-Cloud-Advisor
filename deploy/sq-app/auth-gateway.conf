worker_processes 1;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    server {
        listen 8443 ssl;
        server_name auth-gateway;

        ssl_certificate /run/secrets/auth_tls_cert;
        ssl_certificate_key /run/secrets/auth_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:2m;
        ssl_session_timeout 5m;

        client_max_body_size 1m;

        location = /health {
            return 200 "ok\n";
        }

        location = /auth/v1/token {
            limit_except POST { deny all; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:9999/token;
        }

        location = /auth/v1/user {
            limit_except GET { deny all; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:9999/user;
        }

        location = /auth/v1/logout {
            limit_except POST { deny all; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:9999/logout;
        }

        location = /rest/v1/users {
            limit_except GET { deny all; }
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:3000/users;
        }

        location = /rest/v1/organizations {
            limit_except GET { deny all; }
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:3000/organizations;
        }

        location / {
            return 404;
        }
    }
}
