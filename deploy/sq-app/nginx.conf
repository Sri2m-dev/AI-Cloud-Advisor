pid /tmp/nginx.pid;
events {}
http {
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    log_format bounded '$remote_addr $status $request_time';
    access_log /dev/stdout bounded;
    error_log /dev/stderr warn;
    upstream frontend { server frontend:8501; }
    server {
        listen 8080;
        server_name localhost;
        location = /health { access_log off; return 200 'alive'; }
        location / { return 308 https://localhost$request_uri; }
    }
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != localhost) { return 444; }
        client_max_body_size 20m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location = /health { return 200 'alive'; }
        location = /api { return 404; }
        location /api/ { return 404; }
        location /docs { return 404; }
        location /redoc { return 404; }
        location /openapi.json { return 404; }
        location /metrics { return 404; }
        location /ready { return 404; }
        location /admin { return 404; }
        location /auth { return 404; }
        location /realms { return 404; }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
