name: nexora-sqapp-auth-local-pg17-20261111

services:
  db:
    image: docker.io/library/postgres@sha256:73bedc9eaa0121b92b9b26bb52e5141b3f6f37479c7ef913c0160455763ca80a
    restart: unless-stopped
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique managed local database password}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGPORT: "5432"
    volumes:
      - identity_db:/var/lib/postgresql/data
      - ./auth-bootstrap.sh:/docker-entrypoint-initdb.d/zz-auth-bootstrap.sh:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  auth:
    image: docker.io/supabase/gotrue@sha256:839f529492d116b4e8b7777c953a27c381d34c15a744b1bcefde5eefaa1f9f9f
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 127.0.0.1
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://auth-gateway:8443
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://localhost:18514
      GOTRUE_URI_ALLOW_LIST: https://localhost:18514
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: nexora_auth_admin_disabled
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set local Auth signing material}
      GOTRUE_JWT_ISSUER: https://auth-gateway:8443
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: nexora-auth@example.test
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: "25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  rest:
    image: docker.io/postgrest/postgrest@sha256:c847127074bd26e1b8d3f7c0e6e01e5346f4b85dd34f5d699fd230af960827c0
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,auth
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set local Auth signing material}
      PGRST_JWT_AUD: authenticated
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_SERVER_HOST: 127.0.0.1
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: "3001"
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  gateway:
    image: docker.io/library/nginx@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./auth-gateway-pg17.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - auth_tls_cert
      - auth_tls_key
    networks:
      private:
        aliases:
          - auth-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  private:
    name: nexora-sqapp-auth-local-pg17-20261111_private
    internal: true

volumes:
  identity_db:
    name: nexora-sqapp-auth-local-pg17-20261111_identity_db

secrets:
  auth_tls_cert:
    file: ${SUPABASE_AUTH_TLS_CERT_FILE:?Set managed Auth gateway certificate file}
  auth_tls_key:
    file: ${SUPABASE_AUTH_TLS_KEY_FILE:?Set managed Auth gateway private key file}
