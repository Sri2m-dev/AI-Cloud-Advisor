name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: Dockerfile.frontend
          - service: api
            dockerfile: Dockerfile.api
          - service: worker
            dockerfile: Dockerfile.worker
          - service: beat
            dockerfile: Dockerfile.beat
          - service: nginx
            dockerfile: Dockerfile.nginx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR image namespace
        shell: bash
        run: echo "IMAGE_ROOT=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_ROOT }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_ROOT }}/${{ matrix.service }}:latest

      - name: Trigger deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"service":"${{ matrix.service }}","image":"${{ env.IMAGE_ROOT }}/${{ matrix.service }}:${{ github.sha }}","ref":"${{ github.ref_name }}"}'
          else
            echo "DEPLOY_WEBHOOK_URL is not configured; skipping deployment trigger."
          fi

      - name: Deployment note
        run: |
          echo "Published image: ${{ env.IMAGE_ROOT }}/${{ matrix.service }}:${{ github.sha }}"
          echo "Set DEPLOY_WEBHOOK_URL secret to auto-trigger your deployment target."
