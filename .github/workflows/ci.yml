name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-prod.txt
            requirements.frontend.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-prod.txt \
            -r requirements.frontend.txt \
            -r backend/requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile and import active sources
        run: |
          python - <<'PY'
          import pathlib
          import subprocess

          files = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True
          ).splitlines()
          active = [path for path in files if not path.startswith("archive/")]
          for filename in active:
              source = pathlib.Path(filename).read_text(encoding="utf-8-sig")
              compile(source, filename, "exec")

          import data_fabric
          import psycopg2
          import services.approval_service
          from data_fabric.adapters.supabase import atomic_write

          print(f"Compiled {len(active)} active Python files")
          print("Representative imports passed")
          PY

      - name: Ruff critical active-source checks
        run: ruff check . --exclude archive --select E9,F63,F7

      - name: Ruff certified repository-health checks
        run: |
          ruff check \
            services/approval_service.py \
            tests/services/test_sla_logic.py

      - name: Collect full test suite
        run: pytest --collect-only -q

      - name: Run full test suite without live secrets
        env:
          P3_SUPABASE_RUN_INTEGRATION: ""
          P3_SUPABASE_TEST_URL: ""
          P3_SUPABASE_TEST_SERVICE_ROLE_KEY: ""
        run: pytest -q

      - name: P3 Data Fabric release gate
        run: |
          pytest -q \
            tests/data_fabric/test_supabase_integration_safety.py \
            tests/data_fabric/test_supabase_atomic_write_unit.py \
            tests/data_fabric/test_persistence_foundation.py \
            tests/data_fabric/test_persistence_certification.py \
            tests/data_fabric/test_supabase_adapter_structure.py
          python -m compileall -q data_fabric tests/data_fabric

      - name: Collect gated P3 integrations
        run: |
          pytest --collect-only -q \
            tests/data_fabric/test_supabase_entity_repository_integration.py \
            tests/data_fabric/test_supabase_relationship_history_integration.py \
            tests/data_fabric/test_supabase_governance_semantic_integration.py \
            tests/data_fabric/test_supabase_atomic_write_integration.py

      - name: Verify gated P3 integrations skip without secrets
        env:
          P3_SUPABASE_RUN_INTEGRATION: ""
          P3_SUPABASE_TEST_URL: ""
          P3_SUPABASE_TEST_SERVICE_ROLE_KEY: ""
        run: |
          pytest -q -rs \
            tests/data_fabric/test_supabase_entity_repository_integration.py \
            tests/data_fabric/test_supabase_relationship_history_integration.py \
            tests/data_fabric/test_supabase_governance_semantic_integration.py \
            tests/data_fabric/test_supabase_atomic_write_integration.py
