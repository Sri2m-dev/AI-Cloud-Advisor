name: Background Jobs

on:
  schedule:
    - cron: "0 * * * *"      # hourly jobs
    - cron: "*/15 * * * *"   # 15-minute KPI refresh
    - cron: "0 2 * * *"      # daily optimization
    - cron: "0 3 * * *"      # daily report generation
  workflow_dispatch:

jobs:
  run-background-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Execute scheduled job group
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from backend.jobs.tasks import (
              job_alert_engine_hourly,
              job_anomaly_scan_hourly,
              job_cost_ingestion_hourly,
              job_kpi_refresh_15m,
              job_optimization_engine_daily,
              job_report_generation_daily,
          )

          now = datetime.utcnow()
          minute = now.minute
          hour = now.hour

          # 15-min KPI refresh
          if minute % 15 == 0:
              job_kpi_refresh_15m()

          # hourly ingestion + anomaly
          if minute == 0:
              job_cost_ingestion_hourly()
              job_anomaly_scan_hourly()
              job_alert_engine_hourly()

          # daily jobs
          if hour == 2 and minute == 0:
              job_optimization_engine_daily()
          if hour == 3 and minute == 0:
              job_report_generation_daily()
          PY
