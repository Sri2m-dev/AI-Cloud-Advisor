services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.backend
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKGROUND_JOBS_ENABLED: "false"
      NEXORA_UNIVERSAL_EVIDENCE_DB: /var/lib/nexora/evidence/nexora_evidence.db
    expose:
      - "8000"
    volumes:
      - evidence_data:/var/lib/nexora/evidence
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.backend
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NEXORA_UNIVERSAL_EVIDENCE_DB: /var/lib/nexora/evidence/nexora_evidence.db
    volumes:
      - evidence_data:/var/lib/nexora/evidence
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.beat
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.backend
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NEXORA_UNIVERSAL_EVIDENCE_DB: /var/lib/nexora/evidence/nexora_evidence.db
    volumes:
      - evidence_data:/var/lib/nexora/evidence
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      NEXORA_UNIVERSAL_EVIDENCE_DB: /var/lib/nexora/evidence/nexora_evidence.db
    expose:
      - "8501"
    volumes:
      - evidence_data:/var/lib/nexora/evidence
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8513:80"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  redis_data:
  evidence_data:
